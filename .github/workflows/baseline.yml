name: Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install Python test dependencies
        run: python -m pip install pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Run Python unit baseline
        run: |
          for test_file in \
            test_contracts.py \
            'test_data_*.py' \
            test_evaluation.py \
            'test_geometry_*.py' \
            test_predictions.py \
            test_scoring_v2.py \
            test_splits.py \
            test_training_config.py
          do
            python -m unittest discover -s neural_network/tests -p "$test_file"
          done

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Run Android unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Verify Room schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "Room schema differs from the committed baseline:"
            git status --short -- app/schemas
            find app/schemas -type f -name '*.json' -print -exec cat {} \;
            exit 1
          fi
