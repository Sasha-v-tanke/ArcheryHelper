name: Stage 4 ML checks

on:
  pull_request:
    paths:
      - 'archery_ml/train.py'
      - 'archery_ml/inference.py'
      - 'archery_ml/prepare.py'
      - 'neural_network/archery_ml/**'
      - 'neural_network/configs/impact_mobilenetv3.json'
      - 'neural_network/tests/test_stage4_*.py'
      - '.github/workflows/stage4-ml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage4-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned CPU ML dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==2.2.6 pillow==11.3.0
      - name: Run Stage 4 focused regression suite
        env:
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s neural_network/tests -p 'test_stage4_*.py' -v
